[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rave-edge"
version = "0.0.1"
description = "Mock deployment architecture for RAVE Rear Awareness Vision Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "PyYAML>=6,<7",
]
setup = [
  "fastapi>=0.112,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
rave = "rave_edge.cli:app"
rave-edge = "rave_edge.main:main"

[tool.setuptools]
package-dir = {"" = "edge/src"}

[tool.setuptools.packages.find]
where = ["edge/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
