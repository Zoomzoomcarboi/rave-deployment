# RAVE OS Gate-2B composition for pinned rpi-image-gen v2.7.0.
# This definition is image-build validated, not booted or Pi-validated.
include:
  file: trixie-minbase.yaml
device:
  layer: rpi5
  hostname: rave-pi
image:
  layer: image-rpios
  name: rave-os-gate2b
ieee80211:
  regdom: US
deploy:
  compression: zstd
layer:
  rave_base: rave-base
  rave_identity: rave-identity
  rave_network: rave-network
  rave_hailo: rave-hailo
  rave_runtime: rave-runtime
  rave_web: rave-web
  rave_update: rave-update
