# METABEGIN
# X-Env-Layer-Name: rave-runtime
# X-Env-Layer-Desc: Production runtime boundary; perception intentionally absent in Gate 1
# X-Env-Layer-Version: 0.1.0
# X-Env-Layer-Requires: rave-base
# METAEND
---
mmdebstrap:
  customize-hooks:
    - |-
      set -eu
      rootfs_input=${1:?missing target rootfs}
      rootfs=$(realpath -e -- "$rootfs_input")
      test -n "$rootfs"
      test "$rootfs" != "/"
      test -d "$rootfs"
      mkdir -p "$rootfs/opt/rave/runtime"
      touch "$rootfs/opt/rave/runtime/PERCEPTION_NOT_INTEGRATED"
