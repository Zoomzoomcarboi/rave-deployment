# METABEGIN
# X-Env-Layer-Name: rave-network
# X-Env-Layer-Desc: Gate-2B isolated wlan0 provisioning AP and bounded DHCP
# X-Env-Layer-Version: 0.2.2
# X-Env-Layer-Requires: rave-base
# METAEND
---
mmdebstrap:
  packages: [network-manager, wpasupplicant, dnsmasq-base]
  customize-hooks:
    - |-
      set -eu
      rootfs_input=${1:?missing target rootfs}
      rootfs=$(realpath -e -- "$rootfs_input")
      test -n "$rootfs"
      test "$rootfs" != "/"
      test -d "$rootfs"
      mkdir -p "$rootfs/etc/rave/network"
