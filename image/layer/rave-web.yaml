# METABEGIN
# X-Env-Layer-Name: rave-web
# X-Env-Layer-Desc: RAVE local management web service and static assets
# X-Env-Layer-Version: 0.2.1
# X-Env-Layer-Requires: rave-base
# METAEND
---
mmdebstrap:
  packages: [python3-fastapi, python3-pydantic, python3-uvicorn]
  customize-hooks:
    - |-
      set -eu
      rootfs_input=${1:?missing target rootfs}
      rootfs=$(realpath -e -- "$rootfs_input")
      test -n "$rootfs"
      test "$rootfs" != "/"
      test -d "$rootfs"
      mkdir -p "$rootfs/opt/rave/web"
