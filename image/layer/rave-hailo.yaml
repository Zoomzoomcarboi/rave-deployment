# METABEGIN
# X-Env-Layer-Name: rave-hailo
# X-Env-Layer-Desc: Hailo compatibility boundary; packages intentionally absent in Gate 1
# X-Env-Layer-Version: 0.1.0
# X-Env-Layer-Requires: rave-base
# METAEND
---
mmdebstrap:
  customize-hooks:
    - |-
      set -eu
      rootfs_input=${1:?missing target rootfs}
      rootfs=$(realpath -e -- "$rootfs_input")
      test -n "$rootfs"
      test "$rootfs" != "/"
      test -d "$rootfs"
      mkdir -p "$rootfs/etc/rave/compatibility"
      touch "$rootfs/etc/rave/compatibility/HAILO_STACK_NOT_INTEGRATED"
